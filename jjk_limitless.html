<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJK: Maximum Output - FINAL</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 8%; width: 100%; text-align: center; color: #fff; pointer-events: none; z-index: 10; }
        h1 { font-size: 3.5rem; margin: 0; letter-spacing: 12px; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        #tech-name { font-size: 1.4rem; color: #00ffff; margin-top: 10px; font-weight: bold; letter-spacing: 5px; text-transform: uppercase; transition: 0.3s; }
        #video-container { position: absolute; bottom: 20px; left: 20px; transform: scaleX(-1); width: 240px; height: 180px; border: 2px solid rgba(255, 255, 255, 0.1); z-index: 20; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transition: 0.5s; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px 50px; font-size: 1.8rem; background: #fff; color: #000; border: none; cursor: pointer; z-index: 100; font-weight: 900; border-radius: 8px; box-shadow: 0 0 50px #fff; }
        .black-flash { animation: flash 0.1s infinite; color: #ff0044 !important; text-shadow: 0 0 20px #ff0044; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } } </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="start-btn">EXPAND DOMAIN</button>
    <div id="ui">
        <h1>呪術廻戦</h1>
        <div id="tech-name">AWAITING CURSED ENERGY</div>
    </div>
    <div id="video-container">
        <video class="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- Scene Logic ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 65;
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloom);

    const COUNT = 12000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3), siz = new Float32Array(COUNT);
    const tPos = new Float32Array(COUNT * 3), tCol = new Float32Array(COUNT * 3), tSiz = new Float32Array(COUNT);
    
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(siz, 1));
    const parts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    scene.add(parts);

    let curTech = 'neutral', exploding = false, handIn = false;
    const nameEl = document.getElementById('tech-name'), videoEl = document.querySelector('.input_video'), startBtn = document.getElementById('start-btn');

    // --- Visual Generators ---
    const setShape = (i, x, y, z, r, g, b, s) => {
        tPos[i*3]=x; tPos[i*3+1]=y; tPos[i*3+2]=z;
        tCol[i*3]=r; tCol[i*3+1]=g; tCol[i*3+2]=b;
        tSiz[i]=s;
    };

    function triggerBlast(r, g, b) {
        exploding = true; bloom.strength = 10; nameEl.innerText = "MAXIMUM OUTPUT";
        for(let i=0; i<COUNT; i++) {
            const ang = Math.random()*6.28, phi = Math.random()*3.14, d = 250 + Math.random()*100;
            setShape(i, d*Math.sin(phi)*Math.cos(ang), d*Math.sin(phi)*Math.sin(ang), d*Math.cos(phi), r, g, b, 2);
        }
        setTimeout(() => { exploding = false; bloom.strength = 1.5; update('neutral'); }, 800);
    }

    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6 });

    hands.onResults((res) => {
        const active = res.multiHandLandmarks && res.multiHandLandmarks.length > 0;
        let det = 'neutral';
        if (active) {
            let g = [];
            res.multiHandLandmarks.forEach(lm => {
                const up = (a, b) => lm[a].y < lm[b].y;
                const p = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                if (up(8,6) && up(12,10) && lm[12].x < lm[8].x) g.push('void');
                else if (p < 0.05) g.push('pinch');
                else if (!up(8,6) && !up(12,10)) g.push('fist');
                else if (up(8,6) && up(12,10) && up(16,14) && up(20,18)) g.push('shrine');
                else if (up(8,6) && !up(12,10)) g.push('red');
            });
            if(g.includes('fist') && g.includes('pinch')) det = 'fuga';
            else if(g.includes('void')) det = 'void';
            else if(g.includes('pinch')) det = 'purple';
            else if(g.includes('fist')) det = 'blue';
            else if(g.includes('shrine')) det = 'shrine';
            else if(g.includes('red')) det = 'red';
        } else if (handIn && curTech !== 'neutral' && !exploding) {
            if(curTech === 'blue') triggerBlast(0, 0.5, 1);
            else if(curTech === 'red') triggerBlast(1, 0, 0);
            else if(curTech === 'purple') triggerBlast(0.7, 0, 1);
            else if(curTech === 'fuga') triggerBlast(1, 0.4, 0);
            else triggerBlast(1,1,1);
        }
        if(!exploding) update(det);
        handIn = active;
    });

    function update(t) {
        if(curTech === t || exploding) return;
        curTech = t;
        nameEl.innerText = t === 'neutral' ? "NEUTRAL STATE" : t.toUpperCase();
        videoEl.style.filter = (t === 'void' || t === 'shrine') ? 'brightness(0.1)' : 'brightness(0.4)';

        for(let i=0; i<COUNT; i++) {
            if(t === 'blue') { const r=Math.random()*8, a=Math.random()*6.28, p=Math.acos(2*Math.random()-1); setShape(i, r*Math.sin(p)*Math.cos(a), r*Math.sin(p)*Math.sin(a), r*Math.cos(p), 0, 0.5, 1, 1.5); }
            else if(t === 'red') { const r=Math.random()*8, a=Math.random()*6.28, p=Math.acos(2*Math.random()-1); setShape(i, r*Math.sin(p)*Math.cos(a), r*Math.sin(p)*Math.sin(a), r*Math.cos(p), 1, 0.1, 0.1, 1.5); }
            else if(t === 'purple') { const r=20+Math.random()*5, a=Math.random()*6.28, p=Math.acos(2*Math.random()-1); setShape(i, r*Math.sin(p)*Math.cos(a), r*Math.sin(p)*Math.sin(a), r*Math.cos(p), 0.7, 0, 1, 3); }
            else if(t === 'void') { const a=Math.random()*6.28, r=32+Math.random()*2; setShape(i, r*Math.cos(a), r*Math.sin(a), (Math.random()-0.5)*3, 0.9, 0.9, 1, 2); }
            else if(t === 'fuga') { setShape(i, (Math.random()-0.5)*4, (Math.random()-0.5)*4, -40+Math.random()*80, 1, 0.4, 0, 1.8); }
            else if(t === 'shrine') { if(i < COUNT*0.5) setShape(i, (Math.random()-0.5)*100, -30, (Math.random()-0.5)*100, 0.5, 0, 0, 0.8); else setShape(i, (i%4<2?1:-1)*25, -30+Math.random()*50, (i%2==0?1:-1)*25, 0.2, 0, 0, 1.2); }
            else { setShape(i, i<500?(Math.random()-0.5)*30:0, i<500?(Math.random()-0.5)*30:0, i<500?(Math.random()-0.5)*30:0, 0.1, 0.3, 0.5, 0.4); }
        }
    }

    startBtn.addEventListener('click', () => { startBtn.style.display = 'none'; new Camera(videoEl, { onFrame: async () => { await hands.send({image: videoEl}); }, width: 640, height: 480 }).start(); });

    function animate() {
        requestAnimationFrame(animate);
        const p = parts.geometry.attributes;
        const l = exploding ? 0.06 : 0.15;
        for(let i=0; i<COUNT*3; i++) {
            p.position.array[i] += (tPos[i] - p.position.array[i]) * l;
            p.color.array[i] += (tCol[i] - p.color.array[i]) * l;
        }
        p.position.needsUpdate = p.color.needsUpdate = true;
        if(curTech === 'blue') parts.rotation.z += 0.2;
        else if(curTech === 'purple') { parts.rotation.z += 0.3; parts.rotation.y += 0.05; }
        else if(curTech === 'void') { parts.rotation.x = 1.3; parts.rotation.z += 0.02; }
        composer.render();
    }
    animate();
</script>
</body>
</html>
</body>
</html>
