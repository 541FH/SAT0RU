<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJK: Maximum Output</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', sans-serif; }
        #ui { position: absolute; top: 10%; width: 100%; text-align: center; color: #fff; pointer-events: none; z-index: 10; }
        h1 { font-size: 3rem; margin: 0; letter-spacing: 10px; font-weight: 900; background: linear-gradient(to bottom, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #technique-name { font-size: 1.2rem; color: #00ffff; margin-top: 15px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
        #video-container { position: absolute; bottom: 20px; left: 20px; transform: scaleX(-1); width: 240px; height: 180px; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 20; background-color: #000; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transition: filter 0.3s; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 1.5rem; background: #fff; color: #000; border: none; cursor: pointer; z-index: 100; font-weight: bold; border-radius: 5px; }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } } </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="start-btn">AWAKEN CURSED ENERGY</button>
    <div id="ui">
        <h1>呪術廻戦</h1>
        <div id="technique-name">AWAITING INITIALIZATION</div>
    </div>
    <div id="video-container">
        <video class="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 60;
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloomPass);

    const COUNT = 10000;
    const geometry = new THREE.BufferGeometry();
    const attr = { pos: new Float32Array(COUNT*3), col: new Float32Array(COUNT*3), siz: new Float32Array(COUNT) };
    const targets = { pos: new Float32Array(COUNT*3), col: new Float32Array(COUNT*3), siz: new Float32Array(COUNT) };
    geometry.setAttribute('position', new THREE.BufferAttribute(attr.pos, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(attr.col, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(attr.siz, 1));
    const particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.5, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    scene.add(particles);

    let currentTech = 'neutral';
    let isExploding = false;
    let handWasPresent = false;
    let techStartTime = 0;
    const nameEl = document.getElementById('technique-name');
    const videoEl = document.querySelector('.input_video');
    const startBtn = document.getElementById('start-btn');

    // --- Technique Shapes ---
    const getVoid = () => {
        const a = Math.random() * 6.28; const r = 32;
        return { x: r*Math.cos(a), y: r*Math.sin(a), z: (Math.random()-0.5)*2, r: 0.8, g: 0.9, b: 1, s: 2.2 };
    };
    const getOrb = (isRed) => {
        const r = Math.random() * 9; const t = Math.random()*6.28; const p = Math.acos(2*Math.random()-1);
        return { x: r*Math.sin(p)*Math.cos(t), y: r*Math.sin(p)*Math.sin(t), z: r*Math.cos(p), r: isRed?1:0, g: isRed?0:0.6, b: isRed?0:1, s: 1.5 };
    };
    const getPurple = () => {
        const r = 20 + Math.random()*5; const t = Math.random()*6.28; const p = Math.acos(2*Math.random()-1);
        return { x: r*Math.sin(p)*Math.cos(t), y: r*Math.sin(p)*Math.sin(t), z: r*Math.cos(p), r: 0.8, g: 0, b: 1, s: 3.5 };
    };

    function triggerExplosion() {
        isExploding = true;
        bloomPass.strength = 8.0;
        nameEl.innerText = "MAXIMUM OUTPUT";
        
        for(let i=0; i<COUNT; i++) {
            const angle = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const dist = 150 + Math.random() * 100;
            targets.pos[i*3] = dist * Math.sin(phi) * Math.cos(angle);
            targets.pos[i*3+1] = dist * Math.sin(phi) * Math.sin(angle);
            targets.pos[i*3+2] = dist * Math.cos(phi);
            targets.col[i*3] = 1; targets.col[i*3+1] = 1; targets.col[i*3+2] = 1; // Pure white blast
        }

        setTimeout(() => {
            isExploding = false;
            bloomPass.strength = 1.5;
            updateState('neutral');
        }, 800);
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6 });

    hands.onResults((results) => {
        const handIsPresent = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
        let detected = 'neutral';

        if (handIsPresent) {
            let gestures = [];
            results.multiHandLandmarks.forEach(lm => {
                const isUp = (t, p) => lm[t].y < lm[p].y;
                const pinch = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                if (isUp(8,6) && isUp(12,10) && lm[12].x < lm[8].x) gestures.push('void');
                else if (pinch < 0.05) gestures.push('pinch');
                else if (!isUp(8,6) && !isUp(12,10)) gestures.push('fist');
                else if (isUp(8,6) && isUp(12,10) && isUp(16,14) && isUp(20,18)) gestures.push('shrine');
                else if (isUp(8,6) && !isUp(12,10)) gestures.push('red');
            });
            if(gestures.includes('void')) detected = 'void';
            else if(gestures.includes('pinch')) detected = 'purple';
            else if(gestures.includes('fist')) detected = 'blue';
            else if(gestures.includes('shrine')) detected = 'shrine';
            else if(gestures.includes('red')) detected = 'red';
        } else if (handWasPresent && currentTech !== 'neutral' && !isExploding) {
            triggerExplosion();
        }

        if(!isExploding) updateState(detected);
        handWasPresent = handIsPresent;
    });

    function updateState(tech) {
        if(currentTech === tech || isExploding) return;
        currentTech = tech;
        
        if(tech === 'blue') { nameEl.innerText = "Lapse: Blue"; }
        else if(tech === 'red') { nameEl.innerText = "Reversal: Red"; }
        else if(tech === 'purple') { nameEl.innerText = "Hollow: Purple"; }
        else if(tech === 'void') { nameEl.innerText = "Infinite Void"; }
        else if(tech === 'shrine') { nameEl.innerText = "Malevolent Shrine"; }
        else { nameEl.innerText = "Neutral State"; }

        for(let i=0; i<COUNT; i++) {
            let p;
            if(tech === 'blue') p = getOrb(false);
            else if(tech === 'red') p = getOrb(true);
            else if(tech === 'purple') p = getPurple();
            else if(tech === 'void') p = getVoid();
            else if(tech === 'shrine') p = { x:(Math.random()-0.5)*90, y:-25, z:(Math.random()-0.5)*90, r:0.5, g:0, b:0, s:0.8 };
            else p = (i < 400) ? { x:(Math.random()-0.5)*30, y:(Math.random()-0.5)*30, z:(Math.random()-0.5)*30, r:0.1, g:0.3, b:0.5, s:0.4 } : {x:0,y:0,z:0,r:0,g:0,b:0,s:0};
            
            targets.pos[i*3] = p.x; targets.pos[i*3+1] = p.y; targets.pos[i*3+2] = p.z;
            targets.col[i*3] = p.r; targets.col[i*3+1] = p.g; targets.col[i*3+2] = p.b;
            targets.siz[i] = p.s;
        }
    }

    startBtn.addEventListener('click', () => {
        startBtn.style.display = 'none';
        new Camera(videoEl, { onFrame: async () => { await hands.send({image: videoEl}); }, width: 640, height: 480 }).start();
    });

    function animate() {
        requestAnimationFrame(animate);
        const p = particles.geometry.attributes;
        const lerp = isExploding ? 0.05 : 0.15; // Slow outward blast, fast tech forming
        for(let i=0; i<COUNT*3; i++) {
            p.position.array[i] += (targets.pos[i] - p.position.array[i]) * lerp;
            p.color.array[i] += (targets.col[i] - p.color.array[i]) * lerp;
        }
        p.position.needsUpdate = p.color.needsUpdate = true;
        composer.render();
    }
    animate();
</script>
</body>
</html>
